    name: Backstage
    parents: [plant:pbbls]
    visibility: private
    description: The admin surface, holding analytics, glyph moderation, emotion palettes and the in-app Lab.
  - slug: pbbls-record
    name: Recording a Pebble
    parents: [plant:pbbls]
    visibility: private
    description: The capture flow, from a fifteen-step form to a gesture that takes seconds.
  - slug: pbbls-pebble
    name: Pebbles & Glyphs
    parents: [plant:pbbls]
    visibility: private
    description: The object itself, its shape, valence and colour, and the glyphs people carve by hand.
  - slug: pbbls-path
    name: The Path
    parents: [plant:pbbls]
    visibility: private
    description: Browsing a life backwards, through the timeline, the weeks and the collections.
  - slug: pbbls-karma
    name: Karma & the Glyph Market
    parents: [plant:pbbls]
    visibility: private
    description: The economy, a currency earned by recording and spent on symbols other people drew.
  - slug: pbbls-souls
    name: Souls & Domains
    parents: [plant:pbbls]
    visibility: private
    description: The people who appear in someone's pebbles, and the life dimensions a moment belongs to.
  - slug: pbbls-public
    name: Connecting & Sharing
    parents: [plant:pbbls]
    visibility: private
    description: How a private journal grew a public face without becoming a social network.
  - slug: pbbls-atelier
    name: The Workshop
    parents: [plant:pbbls]
    visibility: private
    description: How Pebbles got made, from the naming and the pivot to the psychology and the agents.
