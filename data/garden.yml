  - slug: celesta-stjernedugg-0
    name: Stjernedugg
    type: song
    date: '2025-11-23'
    description: >-
      À l'aurore scintillent de concert la rosée naissante sur la Terre et les étoiles qui
      s'estompent tendrement dans le Ciel. Et si cet instant, suspendu dans un théâtre polaire,
      s'appelait la Rosée Stellaire ? Stjernedugg.
