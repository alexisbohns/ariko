    name: Uunngåelig
    type: song
    date: '2025-11-30'
    description: >-
      À mesure que l'espace s'étire et que le temps se déverse, que la gravité nous attire et que le
      chaos nous disperse, les souvenirs s'estompent et ma mémoire s'estompe, comme les mots dans le
      sable que les vagues effacent, ou, polis par la rivière les galets que je ramasse
    parents:
