  # Pebbles case-study pod tier (spec 2026-09-02-pbbls-case-study-design 5.2).
  # Explicitly private: the seed's `visibility` is $set on every migrate, so an
  # omitted value would default these PUBLIC on first insert and put eleven empty
  # pods on the live site. Publish via the admin cascade when a pod has its
  # narrative and a published bean -- and drop its `visibility` line here first,
  # or the next migrate will pull it back to private.
  - slug: pbbls-web
    name: The Web App
    parents: [plant:pbbls]
    visibility: private
    description: The Next.js PWA where Pebbles first became usable, and the surface everything else was ported from.
  - slug: pbbls-ios
    name: The iOS App
    parents: [plant:pbbls]
    visibility: private
    description: The native SwiftUI app, and the jump that settled whether Pebbles was an app or a website.
