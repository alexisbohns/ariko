# Work hours (spec docs/superpowers/specs/2026-11-11-work-hours-design.md §4).
# Clones the repos in data/hours.yml treeless, computes sessions, POSTs the
# snapshot. All or nothing: a red run means the site kept the last good one.
name: hours-sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Actions masks the raw secret, not values derived from it. The engine
      # sends the token as a base64 basic-auth header, so mask that form too
      # before anything runs that could echo it.
      - name: Mask the derived token
        run: echo "::add-mask::$(printf 'x-access-token:%s' "$HOURS_GITHUB_TOKEN" | base64 -w0)"
        env:
          HOURS_GITHUB_TOKEN: ${{ secrets.HOURS_GITHUB_TOKEN }}
      - name: Sync hours
        run: npm run hours:sync
        env:
          HOURS_GITHUB_TOKEN: ${{ secrets.HOURS_GITHUB_TOKEN }}
          HOURS_TOKEN: ${{ secrets.HOURS_TOKEN }}
